<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FITQUEST</title>
<meta name="description" content="게임처럼 나를 성장시키는 AI 트레이너">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FITQUEST">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <main id="scr-onb" class="scr" hidden></main>
  <main id="scr-home" class="scr" hidden></main>
  <main id="scr-diet" class="scr" hidden></main>
  <main id="scr-cam" class="scr" hidden></main>
  <main id="scr-work" class="scr" hidden></main>
  <main id="scr-grow" class="scr" hidden></main>
  <main id="scr-set" class="scr" hidden></main>
  <main id="scr-logger" class="lg" hidden></main>
  <main id="scr-sum" class="scr" hidden></main>
  <main id="scr-shoot" hidden></main>
  <main id="scr-cmp" class="scr" hidden></main>
</div>

<nav class="tabbar" aria-label="메인" id="tabbar" hidden>
  <button data-go="home"><svg class="ico" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</button>
  <button data-go="diet"><svg class="ico" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>식단</button>
  <button data-go="cam" aria-label="음식 기록"><span class="cam"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span></button>
  <button data-go="work"><svg class="ico" viewBox="0 0 24 24"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg>운동</button>
  <button data-go="grow"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>성장</button>
</nav>

<div id="overlay"></div>
<div class="toast-wrap" id="toast"></div>
<div class="fq-sr" aria-live="polite" id="live"></div>

<dialog class="fq-levelup" id="lvl" aria-labelledby="lvl-sub">
  <div class="fq-levelup__rays"></div>
  <p class="fq-hud fq-hud--24" style="color:#ECAB37;margin:0">레벨 업!</p>
  <p class="fq-t-mega fq-levelup__num" id="lvl-num">2</p>
  <p class="fq-outline" style="font-size:48px">Level Up</p>
  <p class="levelup-sub" id="lvl-sub"></p>
  <div class="rewards" id="lvl-rw"></div>
  <form method="dialog"><button class="fq-btn fq-btn--lg fq-btn--signal" style="min-width:200px">계속</button></form>
</dialog>

<script src="data.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
